# ═══════════════════════════════════════════════════════════════
# DATUN — CI PIPELINE (Phase 9 — FAANG-grade)
# Runs on every push and PR. Blocks merge if anything fails.
#
# Steps: Install → Generate → Lint → Format → Typecheck →
#        Build → Test → Translation Check → Coverage → Audit
#
# Pattern: Vercel, Cal.com, Linear — all have 15+ step CI.
# ═══════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  DATABASE_URL: 'postgresql://test:test@localhost:5432/datun_test'
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint → Types → Build → Test → i18n
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: datun_shadow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm turbo run db:generate

      # ─────────────────────────────────────────────────────────────────
      # Task #42 — Migration validation (added Day 16)
      # ─────────────────────────────────────────────────────────────────
      # Verifies that:
      #   1. Schema is valid
      #   2. No drift between schema.prisma and migrations folder
      #   3. Migrations apply cleanly to a fresh shadow DB
      # Postgres service (declared at job level) provides shadow DB.
      - name: Validate Prisma schema
        run: pnpm --filter @repo/db prisma validate

      - name: Check no migration drift
        run: |
          pnpm --filter @repo/db prisma migrate diff \
            --from-schema-datamodel packages/db/prisma/schema.prisma \
            --to-migrations packages/db/prisma/migrations \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/datun_shadow_ci

      - name: Apply migrations to shadow DB
        run: pnpm --filter @repo/db prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/datun_shadow_ci

      - name: Lint
        run: pnpm turbo run lint

      - name: Format Check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm turbo run check-types

      - name: Build
        run: pnpm turbo run build
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://datunai.com' }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.datunai.com' }}

      - name: Test with Coverage
        run: pnpm turbo run test:coverage
        env:
          NODE_ENV: 'test'
          JWT_SECRET: 'ci-jwt-secret-minimum-32-characters-long-for-testing'
          JWT_REFRESH_SECRET: 'ci-refresh-secret-minimum-32-characters-different'
          ANTHROPIC_API_KEY: 'sk-ant-ci-test-key'
          DATABASE_URL: 'postgresql://test:test@localhost:5432/datun_test'

      # Phase 9: Translation completeness — blocks merge if Hindi keys missing
      - name: Translation Check (i18n)
        run: cd apps/web && pnpm dlx tsx scripts/check-translations.ts

      # API coverage report on PRs
      - name: API Coverage Report
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: API Coverage
          vite-config-path: ./apps/api/vitest.config.ts
          json-summary-path: ./apps/api/coverage/coverage-summary.json

      # Web coverage report on PRs
      - name: Web Coverage Report
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: Web Coverage
          vite-config-path: ./apps/web/vitest.config.ts
          json-summary-path: ./apps/web/coverage/coverage-summary.json

      - name: Security Audit
        run: pnpm audit --audit-level=high --prod
        continue-on-error: false

  security:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  semgrep:
    name: Security Analysis (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run Semgrep
        run: semgrep scan --config auto --error --severity ERROR

  label:
    name: Auto Label PR
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label PR
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  purge-cache:
    name: Cloudflare Cache Purge
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [quality]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Purge Cloudflare Cache
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything": true}')
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Cloudflare cache purged successfully"
          else
            echo "⚠️ Cache purge returned HTTP $RESPONSE (non-critical)"
          fi
