# ═══════════════════════════════════════════════════════════════
# WEEKLY COMPAT MATRIX — Postgres × Node × Prisma versions
# ═══════════════════════════════════════════════════════════════
name: seed-compat-matrix

on:
  schedule:
    - cron: '0 2 * * 6' # Saturday 02:00 UTC
  workflow_dispatch:

jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        # Node 20 reached EOL Oct 2025 + conflicts with engines.node>=22.
        # Postgres 16 still active LTS until 2028, kept for compat testing.
        postgres: ['16-alpine', '17-alpine', '18-alpine']
        node: ['22', '24']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: datun_compat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/datun_compat
      SKIP_TESTCONTAINERS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/db exec prisma db push
      - run: pnpm --filter @repo/db exec vitest run prisma/seeds/compat-matrix/
      - run: pnpm --filter @repo/db exec vitest run prisma/seeds/validation/e2e/multi-strategy.e2e.test.ts
