# ──────────────────────────────────────────────────────────────────────────
# Migration Validate — PR-triggered deep validation for schema changes.
# ──────────────────────────────────────────────────────────────────────────
#
# Triggers ONLY on PRs that modify migration files. Runs:
#   1. Migration linter (Atlas-pattern policy enforcement)
#   2. Forward apply on fresh shadow DB
#   3. Rollback simulation (apply ROLLBACK.sql, verify state restored)
#   4. Auto-generated changelog comment on the PR
#   5. Impact analysis (estimated lock duration, risk assessment)
#
# Author: Datun Task #42 (Day 16)
# ADR: docs/adr/0002-prisma-migrations-baseline.md
#
name: Migration Validate

on:
  pull_request:
    paths:
      - "packages/db/prisma/migrations/**"
      - "packages/db/prisma/schema.prisma"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: migration-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Migration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: datun_validate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/datun_validate
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/datun_validate_shadow

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @repo/db db:generate

      - name: Create shadow database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE datun_validate_shadow;"

      - name: Detect changed migration folders
        id: detect
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD \
            -- packages/db/prisma/migrations/ \
            | awk -F/ '{print $5}' | sort -u | grep -v '^$' || true)
          if [ -z "$changed" ]; then
            echo "No migration folders changed"
            echo "changed=" >> "$GITHUB_OUTPUT"
          else
            echo "Changed migrations: $changed"
            # Take latest
            latest=$(echo "$changed" | tail -1)
            echo "changed=packages/db/prisma/migrations/$latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint migration SQL
        if: steps.detect.outputs.changed != ''
        run: |
          node -e "
          const { lintMigration, formatLintReport } = require('./packages/db/dist/lib/migration-linter.js');
          const fs = require('fs');
          const sql = fs.readFileSync('${{ steps.detect.outputs.changed }}/migration.sql', 'utf8');
          const result = lintMigration(sql);
          console.log(formatLintReport(result));
          if (!result.passed) process.exit(1);
          "

      - name: Apply forward migration to shadow DB
        run: pnpm --filter @repo/db prisma migrate deploy

      - name: Simulate rollback
        if: steps.detect.outputs.changed != ''
        run: pnpm --filter @repo/db db:rollback:simulate "${{ steps.detect.outputs.changed }}"

      - name: Generate changelog
        if: steps.detect.outputs.changed != ''
        id: changelog
        run: |
          changelog=$(pnpm --filter @repo/db db:changelog:gen "${{ steps.detect.outputs.changed }}")
          {
            echo 'changelog<<EOF'
            echo "$changelog"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Comment changelog on PR
        if: steps.detect.outputs.changed != ''
        uses: actions/github-script@v7
        with:
          script: |
            const changelog = `${{ steps.changelog.outputs.changelog }}`;
            const body = `### Migration impact summary\n\n${changelog}\n\n---\n_Auto-generated by migration-validate.yml_`;
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.startsWith('### Migration impact summary'));
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }