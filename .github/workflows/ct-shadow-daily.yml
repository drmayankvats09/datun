name: ct-shadow-daily

on:
  # schedule:
    # - cron: '30 4 * * *' # 04:30 UTC daily, after eval-nightly
  workflow_dispatch:
    inputs:
      candidate_model:
        description: 'Model to shadow-test'
        type: string
        default: 'claude-haiku-4-5-20251001'

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Pre-flight — verify required secrets
        id: preflight
        run: |
          MISSING=()
          [ -z "$ANTHROPIC_API_KEY" ] && MISSING+=("ANTHROPIC_API_KEY")
          [ -z "$DATABASE_URL" ] && MISSING+=("PROD_DATABASE_URL")
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::warning::Skipping shadow test — missing secrets: ${MISSING[*]}."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.preflight.outputs.skip != 'true'
      - uses: actions/setup-node@v5
        if: steps.preflight.outputs.skip != 'true'
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
        if: steps.preflight.outputs.skip != 'true'
      - run: pnpm --filter @repo/db exec prisma generate
        if: steps.preflight.outputs.skip != 'true'
      - if: steps.preflight.outputs.skip != 'true'
        env:
          CANDIDATE_MODEL: ${{ github.event.inputs.candidate_model || 'claude-haiku-4-5-20251001' }}
        run: |
          pnpm --filter @repo/db exec tsx -e "
            import { PrismaClient } from '@prisma/client';
            import { GOLDEN_CASES, AnthropicAdapter } from './prisma/seeds/ai-training/eval';
            import { runShadow } from './prisma/seeds/continuous-training/shadow/shadow-runner';
            import { compareShadow } from './prisma/seeds/continuous-training/shadow/shadow-comparator';
            import { saveShadowComparison } from './prisma/seeds/continuous-training/shadow/shadow-store';
            (async () => {
              const p = new PrismaClient();
              const prod = new AnthropicAdapter('production-claude-sonnet-4-6', 'claude-sonnet-4-6');
              const cand = new AnthropicAdapter('candidate', process.env.CANDIDATE_MODEL || 'claude-haiku-4-5-20251001');
              for (const c of GOLDEN_CASES.slice(0, 10)) {
                const run = await runShadow('You are Datun dental triage AI.', c.chiefComplaint, prod, cand);
                const cmp = await compareShadow(c, run);
                await saveShadowComparison(p, cmp);
                console.log(c.id, cmp.recommendedAction, 'composite delta', cmp.compositeDelta.toFixed(3));
              }
              await p.\$disconnect();
            })();
          "
