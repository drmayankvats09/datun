# ═══════════════════════════════════════════════════════════════
# DEPENDENCY REVIEW — Block PRs that add vulnerable dependencies
# Pattern: GitHub, Stripe, Shopify — all review deps before merge.
# ═══════════════════════════════════════════════════════════════

name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Scan Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
