# .github/workflows/seed-mutation-test.yml
# ═══════════════════════════════════════════════════════════════
# WEEKLY MUTATION TESTING — Stryker proves tests actually catch bugs
# ═══════════════════════════════════════════════════════════════
name: seed-mutation-test

on:
  schedule:
    - cron: '0 4 * * 1' # Monday 04:00 UTC
  workflow_dispatch:

concurrency:
  group: mutation
  cancel-in-progress: false

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: datun_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/datun_test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/datun_test
      SKIP_TESTCONTAINERS: '1'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @repo/db db:generate

      - name: Apply migrations (mutation tests need full schema)
        run: pnpm --filter @repo/db exec prisma migrate deploy

      - name: Prep tmp dir
        run: mkdir -p packages/db/tmp

      - name: Run Stryker mutation testing
        run: pnpm --filter @repo/db exec stryker run

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mutation-report-${{ github.run_id }}
          path: |
            packages/db/tmp/mutation-report.*
            packages/db/reports/mutation/
          retention-days: 30
