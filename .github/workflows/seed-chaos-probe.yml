# .github/workflows/seed-chaos-probe.yml
# ═══════════════════════════════════════════════════════════════
# DAILY CHAOS + PROBE — verify integrations alive + chaos resilient
# probes: gated on secrets (skip cleanly if not configured)
# chaos:  always runs (self-contained, no external deps)
# ═══════════════════════════════════════════════════════════════
name: seed-chaos-probe

on:
  schedule:
    - cron: '37 5 * * *' # 05:37 UTC daily
  workflow_dispatch:

concurrency:
  group: chaos-probe
  cancel-in-progress: false

jobs:
  # ─── PRE-CHECK: do we have the secrets needed to run probes? ───
  preflight:
    runs-on: ubuntu-latest
    outputs:
      probes_enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          MISSING=()
          [ -z "${ANTHROPIC_API_KEY}" ] && MISSING+=("ANTHROPIC_API_KEY")
          [ -z "${STAGING_DATABASE_URL}" ] && MISSING+=("STAGING_DATABASE_URL")
          [ -z "${WHATSAPP_ACCESS_TOKEN}" ] && MISSING+=("WHATSAPP_ACCESS_TOKEN")
          [ -z "${RESEND_API_KEY}" ] && MISSING+=("RESEND_API_KEY")
          if [ ${#MISSING[@]} -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "✓ All probe secrets present — probes will run"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Probe secrets missing (${MISSING[*]}) — probes job will be skipped"
          fi

  probes:
    needs: preflight
    if: needs.preflight.outputs.probes_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      BETTER_STACK_LOGS_TOKEN: ${{ secrets.BETTER_STACK_LOGS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @repo/db db:generate
      - name: Run probes
        run: |
          pnpm --filter @repo/db exec tsx -e "
          import { verifyAll } from './prisma/seeds/probes';
          (async () => {
            const r = await verifyAll();
            console.log(JSON.stringify(r, null, 2));
            const p0Names = ['db', 'ai-provider'];
            const p0Failed = r.results.filter(p => p0Names.includes(p.name) && p.status === 'red');
            if (p0Failed.length > 0) {
              console.error('✗ P0 probe failure — blocking:', p0Failed.map(p => p.name).join(', '));
              process.exit(1);
            }
            if (r.overallStatus !== 'green') {
              console.log('⚠ Non-P0 probes degraded (whatsapp/resend) — not blocking CI');
            }
          })();
          "

  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: datun_chaos
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/datun_chaos
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/datun_chaos
      SKIP_TESTCONTAINERS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @repo/db db:generate
      - name: Apply migrations (chaos needs full schema, not just db push)
        run: pnpm --filter @repo/db exec prisma migrate deploy
      - name: Run chaos suite
        run: pnpm --filter @repo/db exec tsx prisma/seeds/load-bench/chaos-injector.ts
