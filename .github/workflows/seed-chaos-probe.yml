# ═══════════════════════════════════════════════════════════════
# DAILY CHAOS + PROBE — verify integrations alive + chaos resilient
# ═══════════════════════════════════════════════════════════════
name: seed-chaos-probe

on:
  schedule:
    - cron: '37 5 * * *' # 05:37 UTC daily
  workflow_dispatch:

concurrency: { group: chaos-probe, cancel-in-progress: false }

jobs:
  probes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      BETTER_STACK_LOGS_TOKEN: ${{ secrets.BETTER_STACK_LOGS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Run probes
        run: |
          pnpm --filter @repo/db exec tsx -e "
          import { verifyAll } from './prisma/seeds/probes';
          (async () => {
            const r = await verifyAll();
            console.log(JSON.stringify(r, null, 2));
            if (r.overallStatus === 'red') process.exit(1);
          })();
          "
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_PASSWORD: test, POSTGRES_USER: test, POSTGRES_DB: datun_chaos }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/datun_chaos
      SKIP_TESTCONTAINERS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/db exec prisma db push
      - run: pnpm --filter @repo/db exec tsx prisma/seeds/load-bench/chaos-injector.ts
