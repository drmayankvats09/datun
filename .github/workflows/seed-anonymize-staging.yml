name: Seed Anonymize Staging

on:
  workflow_dispatch:
    inputs:
      tables:
        description: 'CSV of tables to anonymize'
        required: true
        default: 'patient,user,consultation'
      compliance:
        description: 'Compliance profile'
        required: true
        default: 'DPDP'
        type: choice
        options: [DPDP, HIPAA, GDPR, DPDP_HIPAA, DPDP_HIPAA_GDPR]
      dry_run:
        description: 'Dry-run only'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']

concurrency:
  group: seed-anonymize-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  anonymize:
    name: Anonymize on-demand
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging

    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      SEED_ANONYMIZATION_SALT: ${{ secrets.SEED_ANONYMIZATION_SALT }}

    steps:
      - uses: actions/checkout@v4

      - name: Pre-flight — verify required secrets
        id: preflight
        run: |
          if [ -z "${STAGING_DATABASE_URL}" ]; then
            echo "::warning::STAGING_DATABASE_URL not configured — skipping anonymization."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - uses: pnpm/action-setup@v4
        if: steps.preflight.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.skip != 'true'
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile
        if: steps.preflight.outputs.skip != 'true'
      - run: pnpm --filter @repo/db exec prisma generate
        if: steps.preflight.outputs.skip != 'true'

      - name: Anonymize each table
        if: steps.preflight.outputs.skip != 'true'
        env:
          INPUT_TABLES: ${{ inputs.tables }}
          INPUT_COMPLIANCE: ${{ inputs.compliance }}
          INPUT_DRY_RUN_FLAG: ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
        run: |
          IFS=',' read -ra TABLES <<< "$INPUT_TABLES"
          for t in "${TABLES[@]}"; do
            echo "::group::Anonymizing $t"
            pnpm --filter @repo/db exec tsx prisma/seeds/cli/index.ts anonymize \
              --table "$t" \
              --compliance "$INPUT_COMPLIANCE" \
              $INPUT_DRY_RUN_FLAG
            echo "::endgroup::"
          done
