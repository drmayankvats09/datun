name: seed-load-bench

on:
  schedule:
    - cron: '0 1 * * 0' # Sunday 01:00 UTC
  workflow_dispatch:
    inputs:
      k6_type:
        description: 'k6 test type'
        type: choice
        options: [smoke, load, stress, spike, soak, breakpoint]
        default: smoke

concurrency:
  group: seed-load-bench
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASE_URL: ${{ secrets.STAGING_API_URL }}
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      K6_TYPE: ${{ github.event.inputs.k6_type || 'smoke' }}
    steps:
      - uses: actions/checkout@v5

      - name: Pre-flight — verify required secrets
        id: preflight
        run: |
          MISSING=()
          [ -z "${STAGING_API_URL}" ] && MISSING+=("STAGING_API_URL")
          [ -z "${STAGING_DATABASE_URL}" ] && MISSING+=("STAGING_DATABASE_URL")
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::warning::Skipping load bench — missing secrets: ${MISSING[*]}. Configure when staging API is set up."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - uses: pnpm/action-setup@v4
        if: steps.preflight.outputs.skip != 'true'

      - uses: actions/setup-node@v5
        if: steps.preflight.outputs.skip != 'true'
        with: { node-version: '22', cache: 'pnpm' }

      - name: Verify not production
        if: steps.preflight.outputs.skip != 'true'
        run: |
          if [[ "$BASE_URL" == *"api.datunai.com"* ]] && [[ "$BASE_URL" != *"staging"* ]]; then
            echo "::error::Refusing to run load test against production"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
        if: steps.preflight.outputs.skip != 'true'

      - name: Run k6 test
        if: steps.preflight.outputs.skip != 'true'
        run: k6 run "packages/db/prisma/seeds/load-bench/k6/${K6_TYPE}.k6.js"

      - name: Run bench harness
        if: steps.preflight.outputs.skip != 'true'
        run: pnpm --filter @repo/db exec tsx prisma/seeds/load-bench/bench-harness.ts

      - name: Upload reports
        if: steps.preflight.outputs.skip != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: load-bench-${{ github.run_id }}
          path: |
            ./summary.json
            ./bench-report.json
          retention-days: 30
