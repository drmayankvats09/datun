name: ct-drift-hourly

# ─────────────────────────────────────────────────────────────────────
# Hourly continuous-training drift check.
# Detects input drift (age distribution shift) and concept drift
# (urgency distribution shift) over a rolling 7-day vs 30-day baseline.
#
# Implementation: delegates to packages/db CLI (`drift:detect:training`)
# which wraps detectAgeDrift + detectUrgencyDistributionDrift via
# runDriftOrchestration and persists via DriftStore. Single source of
# truth for drift logic.
#
# Pattern: Stripe / Linear cron checks — pre-flight guard on required
# secrets, graceful skip with warning instead of 24×/day email spam.
# ─────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 * * * *' # every hour, on the hour (UTC)
  workflow_dispatch:

concurrency:
  group: ct-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      PAGERDUTY_INTEGRATION_KEY: ${{ secrets.PAGERDUTY_INTEGRATION_KEY }}

    steps:
      - uses: actions/checkout@v5

      # ─────────────────────────────────────────────────────────────
      # Pre-flight: bail early if PROD_DATABASE_URL not configured.
      # Without this guard, the workflow fails 24×/day producing email
      # spam. With it, missing-secret → graceful skip with warning.
      # ─────────────────────────────────────────────────────────────
      - name: Pre-flight — verify required secrets
        id: preflight
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::PROD_DATABASE_URL secret not configured — skipping drift check."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.preflight.outputs.skip != 'true'

      - uses: actions/setup-node@v5
        if: steps.preflight.outputs.skip != 'true'
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.preflight.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      # CRITICAL: prisma generate must run before any code that imports
      # @prisma/client. Without it, the client has no engines/types and
      # the drift CLI crashes at import time.
      - name: Generate Prisma client
        if: steps.preflight.outputs.skip != 'true'
        run: pnpm --filter @repo/db db:generate

      - name: Run continuous-training drift detection
        if: steps.preflight.outputs.skip != 'true'
        run: pnpm --filter @repo/db drift:detect:training
