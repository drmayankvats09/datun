# .github/workflows/synthesis-weekly.yml
name: Synthesis — Weekly Refresh

on:
  schedule:
#    - cron: '0 6 * * 1' # Monday 06:00 UTC = 11:30 IST Monday
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Synthesis strategy'
        required: true
        default: 'persona-vary'
      target_count:
        description: 'Target final count'
        required: true
        default: '500'

concurrency:
  group: synthesis-weekly
  cancel-in-progress: false

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: datun_synth
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/datun_synth
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      STRATEGY: ${{ github.event.inputs.strategy || 'persona-vary' }}
      TARGET: ${{ github.event.inputs.target_count || '500' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # FAANG: hard-skip with explicit reason if upstream secret missing.
      # Better than running 80 min then failing on auth-401.
      - name: Verify secrets
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::ANTHROPIC_API_KEY secret not configured — synthesis cannot run"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @repo/db db:generate

      - name: Apply migrations
        run: pnpm --filter @repo/db exec prisma migrate deploy

      # Ensure tmp/ exists for downstream artifact writes
      - name: Prep tmp dir
        run: mkdir -p packages/db/tmp

      - name: Pre-flight collapse risk
        run: pnpm --filter @repo/db exec tsx prisma/seeds/cli/scripts/lineage-risk-cli.ts --strict

      - name: Synthesize
        run: |
          pnpm --filter @repo/db exec tsx prisma/seeds/cli/index.ts synthesize \
            --strategy "$STRATEGY" \
            --target-final "$TARGET" \
            --quality-min 0.3 \
            --judge-min 3.5 \
            --output ./tmp/synthesis-weekly.jsonl

      - name: Post-synthesis collapse risk
        run: pnpm --filter @repo/db exec tsx prisma/seeds/cli/scripts/lineage-risk-cli.ts --strict

      # FAANG: epsilon:validate takes POSITIONAL numeric args (populationSize, kAnonymity).
      # Old call passed flag-strings → Number('--scope') = NaN → garbage output but exit 0.
      # Now: pass real numbers. 500 = synth pool target, 10 = k-anonymity floor.
      - name: Privacy budget check
        run: pnpm --filter @repo/db exec tsx -e "import { computeEpsilon } from './prisma/seeds/differential-privacy/epsilon-validator'; console.log(JSON.stringify(computeEpsilon(Number(process.argv[2]), Number(process.argv[3])), null, 2));" -- "$TARGET" 10

      - name: Upload synthesis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthesis-weekly-${{ github.run_id }}
          path: packages/db/tmp/synthesis-weekly.jsonl
          retention-days: 30
