name: outbox-cleanup-daily

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC daily
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Pre-flight — verify required secrets
        id: preflight
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::PROD_DATABASE_URL secret not configured — skipping outbox cleanup."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.preflight.outputs.skip != 'true'
      - uses: actions/setup-node@v5
        if: steps.preflight.outputs.skip != 'true'
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
        if: steps.preflight.outputs.skip != 'true'

      # CRITICAL: prisma generate must run before code imports @prisma/client.
      - run: pnpm --filter @repo/db db:generate
        if: steps.preflight.outputs.skip != 'true'

      - name: Cleanup published events + archive old DLQ
        if: steps.preflight.outputs.skip != 'true'
        run: |
          pnpm --filter @repo/db exec tsx -e "
            import { PrismaClient } from '@prisma/client';
            import { cleanupPublishedOutbox, archiveDeadLetters } from './prisma/seeds/outbox';
            (async () => {
              const p = new PrismaClient();
              const c = await cleanupPublishedOutbox(p, 7);
              const a = await archiveDeadLetters(p, 90);
              console.log({ cleaned: c, archivedDlq: a });
              await p.\$disconnect();
            })();
          "
