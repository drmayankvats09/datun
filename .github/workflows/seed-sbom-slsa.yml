# ═══════════════════════════════════════════════════════════════
# SBOM (CycloneDX) + SLSA L3 PROVENANCE — supply chain security
# Sources: cyclonedx-npm + slsa-github-generator
# ═══════════════════════════════════════════════════════════════
name: seed-sbom-slsa

on:
  push:
    tags: ['db-v*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sbom_path: ${{ steps.sbom.outputs.sbom_path }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - id: sbom
        name: Generate CycloneDX SBOM (pnpm-native)
        run: |
          # cdxgen is pnpm-aware. cyclonedx-npm shells out to `npm ls`
          # which can't parse pnpm's workspace hoisting and produces
          # invalid SBOM with hundreds of false errors.
          mkdir -p packages/db/tmp
          npx -y @cyclonedx/cdxgen \
            --type pnpm \
            --output packages/db/tmp/sbom.cyclonedx.json \
            packages/db
          echo "sbom_path=packages/db/tmp/sbom.cyclonedx.json" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v5
        with:
          name: sbom-${{ github.sha }}
          path: packages/db/tmp/sbom.cyclonedx.json

  attest:
    needs: sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: ./sbom
      - name: Attest build provenance (SLSA L3)
        # GitHub's attestation feature requires public repos for personal accounts.
        # Datun is private — keep step but allow graceful skip. Will auto-enable
        # when repo flips public or org-owned.
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ./sbom/sbom.cyclonedx.json
      - name: Attest SBOM
        continue-on-error: true
        uses: actions/attest-sbom@v2
        with:
          subject-path: ./sbom/sbom.cyclonedx.json
          sbom-path: ./sbom/sbom.cyclonedx.json
