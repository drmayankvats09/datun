# ═══════════════════════════════════════════════════════════════
# SBOM (CycloneDX) + SLSA L3 PROVENANCE — supply chain security
# Sources: cyclonedx-npm + slsa-github-generator
# ═══════════════════════════════════════════════════════════════
name: seed-sbom-slsa

on:
  push:
    tags: ['db-v*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sbom_path: ${{ steps.sbom.outputs.sbom_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - id: sbom
        name: Generate CycloneDX SBOM
        run: |
          pnpm --filter @repo/db exec cyclonedx-npm \
            --output-format JSON \
            --output-file packages/db/tmp/sbom.cyclonedx.json
          echo "sbom_path=packages/db/tmp/sbom.cyclonedx.json" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: packages/db/tmp/sbom.cyclonedx.json

  attest:
    needs: sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: ./sbom
      - name: Attest build provenance (SLSA L3)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ./sbom/sbom.cyclonedx.json
      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-path: ./sbom/sbom.cyclonedx.json
          sbom-path: ./sbom/sbom.cyclonedx.json
