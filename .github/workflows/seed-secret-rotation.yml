name: Seed Secret Rotation

on:
  schedule:
    - cron: '0 5 1 * *' # 1st of every month at 05:00 UTC
  workflow_dispatch:

concurrency:
  group: seed-secret-rotation
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Audit secret freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets present
        run: |
          declare -a REQUIRED=(SEED_ANONYMIZATION_SALT STAGING_DATABASE_URL AWS_OIDC_ROLE_ARN)
          MISSING=()
          for s in "${REQUIRED[@]}"; do
            if [ -z "${!s:-}" ]; then MISSING+=("$s"); fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::warning::Skipping rotation reminder — missing secrets: ${MISSING[*]}. Configure when staging + AWS are set up."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "All required secrets present."
        id: preflight
        env:
          SEED_ANONYMIZATION_SALT: ${{ secrets.SEED_ANONYMIZATION_SALT }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          AWS_OIDC_ROLE_ARN: ${{ secrets.AWS_OIDC_ROLE_ARN }}

      - name: Open rotation reminder issue
        if: steps.preflight.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Monthly] Rotate seed-pipeline secrets — ${today}`,
              body: [
                'Monthly secret-rotation reminder.',
                '',
                'Rotate the following secrets within 14 days:',
                '- `SEED_ANONYMIZATION_SALT` (any non-prod value works; rotate quarterly minimum)',
                '- `STAGING_DATABASE_URL` (rotate password via Railway)',
                '- `AWS_OIDC_ROLE_ARN` (verify trust policy)',
                '- `SLACK_WEBHOOK_URL` (regenerate in Slack admin)',
                '- `RESEND_API_KEY` (regenerate in Resend dashboard)',
                '',
                'After rotation: re-run `seed-anonymize-staging` workflow to confirm new salt.',
              ].join('\n'),
              labels: ['security', 'maintenance', 'monthly'],
            });
