name: seed-eval-nightly

on:
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC daily
  workflow_dispatch:

concurrency: { group: eval-nightly, cancel-in-progress: false }

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @repo/db db:generate
      - name: Run eval suite
        run: pnpm --filter @repo/db exec tsx prisma/seeds/cli/index.ts eval run --model claude-sonnet-4-6 --output ./tmp/eval-nightly.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_id }}
          path: packages/db/tmp/eval-nightly.json
      - name: Notify on regression
        if: failure()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{"text":"🚨 Datun nightly eval REGRESSED — investigate before next deploy"}'
