name: Feature Request
description: Suggest a feature for Datun
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: Thank you for suggesting a feature.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
      placeholder: I'm frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you considered?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend (Web)
        - Backend (API)
        - Database
        - AI/Chat
        - WhatsApp
        - DevOps/CI
        - Other
    validations:
      required: true
