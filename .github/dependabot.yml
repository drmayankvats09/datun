# ═══════════════════════════════════════════════════════════════
# DEPENDABOT — Auto-create PRs for dependency updates (grouped)
# ═══════════════════════════════════════════════════════════════

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels: [dependencies, auto-update]
    commit-message:
      prefix: 'chore(deps)'
    groups:
      dev-tools:
        patterns:
          ['turbo', 'husky', 'prettier*', 'vitest', '@vitest/*', 'lint-staged', 'typescript']

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels: [dependencies, web]
    commit-message:
      prefix: 'chore(deps-web)'
    groups:
      react-ecosystem:
        patterns: ['react*', 'next*', '@next/*']
      ui-libraries:
        patterns: ['tailwindcss', '@tailwindcss/*', 'lucide-react', '@radix-ui/*']
      sentry:
        patterns: ['@sentry/*']

  - package-ecosystem: npm
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels: [dependencies, api]
    commit-message:
      prefix: 'chore(deps-api)'
    groups:
      express-ecosystem:
        patterns: ['express*', 'cors', 'helmet']
      auth:
        patterns: ['bcryptjs', 'jsonwebtoken']
      observability:
        patterns: ['@sentry/*', '@logtail/*', 'winston']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kolkata
    labels: [dependencies, ci]
    commit-message:
      prefix: 'chore(deps-ci)'
