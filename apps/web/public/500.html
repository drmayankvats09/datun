<!doctype html>
<!--
  apps/web/public/500.html
  ═══════════════════════════════════════════════════════════════
  PLATFORM-LEVEL 500 — Task #52 Phase 5

  Vercel automatically serves this file when:
    - A Next.js function threw before a response could be sent
    - The function timed out (10 s on hobby, 60 s on pro)
    - The function ran out of memory
    - The edge runtime encountered an internal error

  Vercel-specific token injection (Jan 2026 feature):
    - `::vercel:REQUEST_ID::` is replaced with the failing request's
      ID at serve time. Surfaced to the user as a copy-able reference.
    - `::vercel:ERROR_CODE::` is replaced with a Vercel-defined code
      (FUNCTION_INVOCATION_TIMEOUT, etc.) — useful for support triage.

  If Vercel hasn't yet rolled out the token-replacement (rare), the
  raw tokens render. Acceptable degradation — the tokens are still
  meaningful to anyone who searches Vercel docs.

  Constraints (same as 404.html):
    - ZERO external dependencies
    - Inline CSS, brand colors hardcoded
    - English only

  Brand colors:
    - Primary teal:    #00A896
    - Background dark: #0A0F1A
    - Error red tint:  rgba(239, 68, 68, 0.1)
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Something went wrong — Datun</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: #ffffff;
        color: #0a0f1a;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0a0f1a;
          color: #f8fafc;
        }
        .description { color: #94a3b8; }
        .reference { color: #64748b; }
        .secondary-link {
          color: #f8fafc;
          border-color: #1e293b;
        }
        .icon {
          background: rgba(239, 68, 68, 0.15);
        }
      }
      .container { max-width: 460px; width: 100%; }
      .icon {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: rgba(239, 68, 68, 0.1);
        color: #dc2626;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
        font-size: 32px;
        line-height: 1;
      }
      h1 {
        font-size: 28px;
        font-weight: 700;
        margin: 16px 0 12px;
        line-height: 1.2;
      }
      .description {
        font-size: 15px;
        color: #6b7280;
        line-height: 1.5;
        margin: 0 0 24px;
      }
      .reference {
        margin: 0 0 32px;
        padding: 12px 16px;
        font-size: 12px;
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        color: #6b7280;
        background: rgba(0, 0, 0, 0.03);
        border-radius: 8px;
        word-break: break-all;
      }
      @media (prefers-color-scheme: dark) {
        .reference {
          background: rgba(255, 255, 255, 0.04);
        }
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }
      .primary-link {
        padding: 10px 24px;
        background: #00a896;
        color: #ffffff;
        text-decoration: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        transition: background 150ms;
      }
      .primary-link:hover { background: #008f7f; }
      .secondary-link {
        padding: 10px 24px;
        background: transparent;
        color: #0a0f1a;
        text-decoration: none;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
      }
      .contact {
        margin-top: 24px;
        font-size: 12px;
        color: #9ca3af;
      }
      .contact a {
        color: #00a896;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="container" role="alert" aria-live="assertive">
      <div class="icon" aria-hidden="true">⚠</div>
      <h1>Something went wrong</h1>
      <p class="description">
        An unexpected error occurred. Our team has been notified and is looking into it.
      </p>
      <!--
        Vercel replaces these tokens at serve time. If you see the
        literal "::vercel:..::" text in production, the platform
        token-replacement is misconfigured — open a support ticket.
      -->
      <p class="reference">
        Reference: ::vercel:REQUEST_ID::<br />
        Code: ::vercel:ERROR_CODE::
      </p>
      <div class="actions">
        <a href="/" class="primary-link">Go to homepage</a>
        <a href="javascript:location.reload()" class="secondary-link">Reload page</a>
      </div>
      <p class="contact">
        Need help?
        <a href="mailto:hello@datunai.com">hello@datunai.com</a>
      </p>
    </div>
  </body>
</html>
